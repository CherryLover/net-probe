<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>网络探针</title>
<style>
:root{
  --bg:#F5F6F8; --card:#FFFFFF; --line:#E5E7EB; --line2:#F0F1F3; --soft:#F9FAFB; --chip:#F3F4F6;
  --ink:#111827; --ink2:#374151; --ink3:#4B5563; --muted:#9CA3AF;
  --accent:#2563EB;
  --ok-bg:#E7F5EC; --ok-fg:#166534; --ok-dot:#16A34A;
  --slow-bg:#FDF1DF; --slow-fg:#92400E; --slow-dot:#D97706;
  --down-bg:#FBE7E7; --down-fg:#991B1B; --down-dot:#DC2626;
  --chk-bg:#E8EEFB; --chk-fg:#1E40AF; --chk-dot:#3B82F6;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}
.wrap{max-width:1200px;margin:0 auto;padding:28px 24px 64px;display:flex;flex-direction:column;gap:28px}
.progress{height:3px;background:var(--line)}
.progress>div{height:3px;background:var(--accent);width:0}
.progress>div.run{transition:width 1s linear}

header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:40px;height:40px;border-radius:10px;background:var(--ink);display:flex;align-items:center;justify-content:center}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
h2{margin:0;font-size:16px;font-weight:600}
.sub{margin:0;color:var(--ink3);font-size:13px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.btn{height:44px;padding:0 16px;border-radius:8px;border:1px solid #D1D5DB;background:#fff;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.btn.sm{height:36px;padding:0 12px;font-size:13px;color:var(--ink2)}
.btn.primary{border:0;background:var(--accent);color:#fff;font-weight:600}
.btn.dark{border:0;background:var(--ink);color:#fff;font-weight:600}
.icon-btn{width:40px;height:40px;border:0;background:transparent;border-radius:8px;color:var(--ink3);display:inline-flex;align-items:center;justify-content:center;transition:background-color .2s}
.icon-btn:hover{background:var(--chip)}

.live{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--chip);color:var(--ink3);transition:background-color .3s,color .3s}
.live i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.live.on{background:var(--ok-bg);color:var(--ok-fg)}
.live.on i{background:var(--ok-dot);animation:livePulse 1.4s ease-out infinite}

.panel{background:var(--card);border:1px solid var(--line);border-radius:12px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:12px 16px}
.seg{display:inline-flex;flex-wrap:wrap;padding:3px;gap:2px;background:var(--chip);border-radius:10px}
.seg button{height:32px;padding:0 12px;border:0;border-radius:8px;font-size:13px;font-weight:500;background:transparent;color:var(--ink3);transition:background-color .2s,color .2s,box-shadow .2s}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(17,24,39,.12)}
.spacer{flex:1 1 auto}
.muted{color:var(--ink3);font-size:13px}

.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.card{padding:20px;display:flex;flex-direction:column;gap:10px}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-label{font-size:13px;font-weight:600;color:var(--ink2)}
.chip{font-size:12px;color:var(--ink3);background:var(--chip);border-radius:999px;padding:2px 10px;white-space:nowrap}
.chip.diff{background:var(--chk-bg);color:var(--chk-fg)}
.chip.same{background:var(--ok-bg);color:var(--ok-fg)}
.chip.err{background:var(--down-bg);color:var(--down-fg)}
.ip{font-family:var(--mono);font-size:21px;font-weight:500;letter-spacing:-.01em;word-break:break-all;border-radius:6px;margin:0 -6px;padding:0 6px;min-height:32px}
.ip.err{font-family:inherit;font-size:15px;color:var(--down-fg);display:flex;align-items:center}
.card-meta{display:flex;flex-direction:column;gap:2px;color:var(--ink2);font-size:13px;min-height:40px}
.card-foot{border-top:1px solid var(--line2);padding-top:10px;color:var(--ink3);font-size:12px;display:flex;justify-content:space-between;gap:8px}
.card-foot span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.exit{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:16px 20px;border-bottom:1px solid var(--line2)}
.exit:last-child{border-bottom:0}
.badge{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none}
.exit-main{flex:1 1 220px;min-width:0}
.exit-ip{font-family:var(--mono);font-size:15px;font-weight:500;word-break:break-all}
.route{font-size:12px;font-weight:600;color:var(--ink2);border:1px solid #D1D5DB;border-radius:999px;padding:2px 10px}
.hits{flex:1 1 260px;color:var(--ink2);font-size:13px}
.empty{padding:20px;color:var(--ink3);font-size:13px}

.counts{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.c-ok{color:var(--ok-fg);font-size:13px}.c-slow{color:var(--slow-fg);font-size:13px}.c-down{color:var(--down-fg);font-size:13px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{height:36px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:500;background:#fff;color:var(--ink2);border:1px solid #D1D5DB;transition:background-color .22s,color .22s,border-color .22s}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

.table{overflow-x:auto}
.grid{display:grid;grid-template-columns:1.2fr 1.8fr 84px 118px 132px 80px 132px;gap:12px;align-items:center;padding:6px 20px;min-width:960px}
.thead{background:var(--soft);border-bottom:1px solid var(--line);color:var(--ink3);font-size:12px;font-weight:600;padding-top:12px;padding-bottom:12px;border-radius:12px 12px 0 0}
.trow{border-bottom:1px solid var(--line2)}
.name{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.url{font-family:var(--mono);font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.url small{display:block;font-size:11px;color:var(--ink3)}
.grp{font-size:13px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;width:fit-content;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--chip);color:var(--ink3);transition:background-color .32s,color .32s;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--muted);transition:background-color .32s}
.pill.ok{background:var(--ok-bg);color:var(--ok-fg)}.pill.ok i{background:var(--ok-dot)}
.pill.slow{background:var(--slow-bg);color:var(--slow-fg)}.pill.slow i{background:var(--slow-dot)}
.pill.down{background:var(--down-bg);color:var(--down-fg)}.pill.down i{background:var(--down-dot)}
.pill.checking{background:var(--chk-bg);color:var(--chk-fg)}.pill.checking i{background:var(--chk-dot);animation:pulse .9s ease-out infinite}
.spark{display:flex;align-items:flex-end;gap:3px;height:26px}
.spark span{width:6px;border-radius:2px;height:4px;background:var(--line);transition:height .42s var(--ease),background-color .3s}
.lat{font-family:var(--mono);font-size:13px;color:var(--ink2);border-radius:4px;padding:2px 4px;margin-left:-4px;width:fit-content}
.lat.blink{animation:blink .9s ease-in-out infinite}
.acts{display:flex;justify-content:flex-end;gap:2px}
.spin svg,.spin{animation:spin .8s linear infinite}
.icon-btn.spin{animation:none}.icon-btn.spin svg{animation:spin .8s linear infinite}

form.add{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;padding:16px 20px;background:var(--soft);border-radius:0 0 12px 12px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:600;color:var(--ink2)}
.field input,.field select{height:44px;padding:0 12px;border:1px solid #D1D5DB;border-radius:8px;background:#fff;font-size:14px;width:100%}
.note{flex-basis:100%;margin:0;color:var(--ink3);font-size:12px}
details.adv{flex-basis:100%}
details.adv summary{cursor:pointer;font-size:13px;color:var(--ink2);width:fit-content}
.adv-body{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}

details.settings>summary{cursor:pointer;padding:14px 16px;font-weight:600;list-style:none;display:flex;align-items:center;justify-content:space-between}
details.settings>summary::-webkit-details-marker{display:none}
.settings-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px}
.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.check{display:flex;align-items:center;gap:8px;font-size:13px;height:44px}
.check input{width:18px;height:18px}
textarea{width:100%;min-height:200px;border:1px solid #D1D5DB;border-radius:8px;padding:10px 12px;font-family:var(--mono);font-size:12px;line-height:1.5;resize:vertical}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s var(--ease)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.rise{animation:rise .46s var(--ease) both}
.flash{animation:flash 1.1s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes flash{0%{background-color:#DBEAFE}100%{background-color:rgba(219,234,254,0)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(59,130,246,.55)}100%{box-shadow:0 0 0 7px rgba(59,130,246,0)}}
@keyframes livePulse{0%{box-shadow:0 0 0 0 rgba(22,163,74,.55)}100%{box-shadow:0 0 0 7px rgba(22,163,74,0)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes spin{to{transform:rotate(360deg)}}
body.no-motion *,body.no-motion *::before,body.no-motion *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="progress" aria-hidden="true"><div id="progress"></div></div>
<div class="wrap">

<header>
  <div class="brand">
    <div class="logo"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18"/><path d="M12 3a14 14 0 0 0 0 18"/></svg></div>
    <div>
      <div class="row" style="gap:10px"><h1>网络探针</h1><span class="live" id="live"><i></i><span>手动</span></span></div>
      <p class="sub">本机 IP · 出口分流 · 自定义站点可用性</p>
    </div>
  </div>
  <div class="row">
    <button type="button" class="btn" id="btnHide" aria-pressed="false">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      <span>隐藏 IP</span>
    </button>
    <button type="button" class="btn primary" id="btnRun">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
      <span>立即检测</span>
    </button>
  </div>
</header>

<div class="panel bar">
  <span style="font-size:13px;font-weight:600;color:var(--ink2)">自动刷新</span>
  <div class="seg" role="group" aria-label="刷新间隔" id="intervals"></div>
  <button type="button" class="btn sm" id="btnPause">暂停</button>
  <span class="spacer"></span>
  <span class="muted">上次检测 <span class="mono" style="color:var(--ink)" id="lastChecked">—</span></span>
  <span class="muted" id="countdown" style="min-width:110px;text-align:right">—</span>
</div>

<section class="sec">
  <div class="sec-h"><h2>当前 IP</h2><span class="muted">从不同检测源查询，对比国内 / 境外视角是否一致</span></div>
  <div class="cards" id="ipCards"></div>
</section>

<section class="sec">
  <div class="sec-h"><h2>出口 IP 汇总</h2><span class="muted">按检测结果归并，看流量实际从哪几个出口出去</span></div>
  <div class="panel" id="exits"></div>
</section>

<section class="sec">
  <div class="sec-h" style="align-items:center">
    <div class="counts"><h2>站点可用性</h2><span class="c-ok" id="cOk"></span><span class="c-slow" id="cSlow"></span><span class="c-down" id="cDown"></span></div>
    <div class="row" style="gap:8px">
      <button type="button" class="btn sm" id="btnImport">导入 JSON</button>
      <button type="button" class="btn sm" id="btnExport">导出 JSON</button>
      <input type="file" id="fileImport" accept="application/json,.json" hidden>
    </div>
  </div>
  <div class="tabs" role="tablist" aria-label="分组" id="tabs"></div>
  <div class="panel">
    <div class="table">
      <div class="grid thead"><span>名称</span><span>地址</span><span>分组</span><span>状态</span><span>近 14 次延迟</span><span>延迟</span><span style="text-align:right">操作</span></div>
      <div id="rows"></div>
    </div>
    <form class="add" id="form" autocomplete="off">
      <div class="field" style="flex:1 1 150px"><label for="fName">名称</label><input id="fName" type="text" placeholder="如：订单服务"></div>
      <div class="field" style="flex:2 1 260px"><label for="fUrl">网址</label><input id="fUrl" type="text" class="mono" placeholder="https://order.example.com/health" required></div>
      <div class="field" style="flex:0 1 150px"><label for="fGroup">分组</label><input id="fGroup" type="text" list="groupList" placeholder="内部服务"><datalist id="groupList"></datalist></div>
      <button type="submit" class="btn dark" id="btnSubmit">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        <span>添加站点</span>
      </button>
      <button type="button" class="btn" id="btnCancel" hidden>取消</button>
      <details class="adv">
        <summary>高级选项</summary>
        <div class="adv-body">
          <div class="field" style="flex:0 1 240px"><label for="fMode">检测方式</label>
            <select id="fMode">
              <option value="no-cors">仅连通性（任何站点）</option>
              <option value="cors">读取状态码（站点需允许跨域）</option>
            </select>
          </div>
          <div class="field" style="flex:1 1 320px"><label for="fEcho">IP 回显接口（可选，用于判断该站点走哪个出口）</label><input id="fEcho" type="text" class="mono" placeholder="https://order.example.com/cdn-cgi/trace"></div>
        </div>
      </details>
      <p class="note">站点列表和设置保存在本机浏览器里；换电脑时用「导出 / 导入 JSON」带走。</p>
    </form>
  </div>
</section>

<details class="panel settings" id="settings">
  <summary><span>设置</span><span class="muted" style="font-weight:400">阈值、动画、IP 检测源</span></summary>
  <div class="settings-body">
    <div class="settings-grid">
      <div class="field"><label for="sSlow">较慢阈值（ms）</label><input id="sSlow" type="number" min="50" step="50"></div>
      <div class="field"><label for="sTimeout">超时（ms）</label><input id="sTimeout" type="number" min="1000" step="500"></div>
      <div class="field"><label for="sStagger">逐个检测间隔（ms）</label><input id="sStagger" type="number" min="0" max="1000" step="10"></div>
      <label class="check"><input id="sMotion" type="checkbox"> 开启动画</label>
    </div>
    <div class="field">
      <label for="sSources">IP 检测源（JSON）· parse 可选 ipsb / ipip / cftrace / ipapi / ipify / text；base: true 的源作为「直连」基准</label>
      <textarea id="sSources" spellcheck="false"></textarea>
    </div>
    <div class="row" style="gap:8px">
      <button type="button" class="btn sm" id="btnSaveSettings">保存设置</button>
      <button type="button" class="btn sm" id="btnReset">恢复默认配置</button>
    </div>
  </div>
</details>

</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';

/* ---------- 默认配置 ---------- */
const LS_KEY = 'net-probe:config:v1';
const HIST_LEN = 14;
const DEFAULTS = {
  version: 1,
  interval: 30,
  slowMs: 1000,
  timeoutMs: 8000,
  stagger: 60,
  motion: true,
  geoLookup: 'https://api.ip.sb/geoip/{ip}',
  ipSources: [
    { id: 'cn',   label: '国内视角 IPv4', url: 'https://myip.ipip.net/json',             parse: 'ipip',    base: true },
    { id: 'intl', label: '境外视角 IPv4', url: 'https://api-ipv4.ip.sb/geoip',           parse: 'ipsb' },
    { id: 'cf',   label: 'Cloudflare',    url: 'https://www.cloudflare.com/cdn-cgi/trace', parse: 'cftrace' },
    { id: 'v6',   label: 'IPv6',          url: 'https://api-ipv6.ip.sb/geoip',           parse: 'ipsb',    family: 'v6' }
  ],
  sites: [
    { id: 's1', name: 'GitHub',     url: 'https://github.com',                     group: '国际' },
    { id: 's2', name: 'Google',     url: 'https://www.google.com/generate_204',    group: '国际' },
    { id: 's3', name: 'ChatGPT',    url: 'https://chatgpt.com',                    group: '国际' },
    { id: 's4', name: 'Cloudflare', url: 'https://www.cloudflare.com',             group: '国际' },
    { id: 's5', name: 'YouTube',    url: 'https://www.youtube.com',                group: '国际' },
    { id: 's6', name: '百度',       url: 'https://www.baidu.com',                  group: '国内' },
    { id: 's7', name: '阿里云',     url: 'https://www.aliyun.com',                 group: '国内' },
    { id: 's8', name: '哔哩哔哩',   url: 'https://www.bilibili.com',               group: '国内' }
  ]
};
const INTERVALS = [[0, '关闭'], [10, '10 秒'], [30, '30 秒'], [60, '1 分钟'], [300, '5 分钟']];
const BADGES = [['#E7F5EC', '#166534'], ['#E8EEFB', '#1E40AF'], ['#F1E9FB', '#5B21B6'], ['#FDF1DF', '#92400E'], ['#E6F4F4', '#115E59'], ['#FCE7F3', '#9D174D']];

/* ---------- 工具 ---------- */
const $ = (id) => document.getElementById(id);
const clone = (o) => JSON.parse(JSON.stringify(o));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const IPV4_RE = /\b(?:\d{1,3}\.){3}\d{1,3}\b/;
const IPV6_RE = /\b(?:[0-9a-f]{1,4}:){2,7}[0-9a-f]{0,4}(?::[0-9a-f]{1,4})*\b/i;
const findIp = (t) => { const m = String(t).match(IPV4_RE) || String(t).match(IPV6_RE); return m ? m[0] : ''; };
const two = (n) => (n < 10 ? '0' : '') + n;
const clock = (d) => two(d.getHours()) + ':' + two(d.getMinutes()) + ':' + two(d.getSeconds());
const fmtSec = (s) => (s >= 60 ? Math.floor(s / 60) + ' 分 ' + (s % 60) + ' 秒' : s + ' 秒');
let regionNames = null;
try { regionNames = new Intl.DisplayNames(['zh-CN'], { type: 'region' }); } catch (e) { /* 老浏览器 */ }
const regionName = (cc) => { try { return regionNames ? regionNames.of(cc) : cc; } catch (e) { return cc; } };
const joinNz = (arr, sep) => arr.filter((x, i) => x && arr.indexOf(x) === i).join(sep);

function replay(el, cls) {
  if (!el) return;
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
}

let toastTimer = null;
function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

async function fetchT(url, opts, timeoutMs) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), timeoutMs || cfg.timeoutMs);
  try {
    return await fetch(url, Object.assign({ cache: 'no-store', credentials: 'omit', signal: ctrl.signal }, opts || {}));
  } finally {
    clearTimeout(t);
  }
}

/* ---------- 解析器：把各家 IP 接口的返回统一成 {ip, geo, isp} ---------- */
const PARSERS = {
  ipsb(t) {
    const j = JSON.parse(t);
    return { ip: j.ip, geo: joinNz([j.country, j.region, j.city], ' · '), isp: joinNz([j.organization || j.isp, j.asn ? 'AS' + j.asn : ''], ' · ') };
  },
  ipip(t) {
    const j = JSON.parse(t);
    const d = j.data || {};
    const l = d.location || [];
    return { ip: d.ip, geo: joinNz([l[0], l[1], l[2]], ' · '), isp: l[4] || l[3] || '' };
  },
  cftrace(t) {
    const m = {};
    String(t).trim().split('\n').forEach((line) => { const i = line.indexOf('='); if (i > 0) m[line.slice(0, i)] = line.slice(i + 1); });
    return { ip: m.ip, geo: m.loc ? regionName(m.loc) : '', isp: m.colo ? 'Cloudflare 节点 ' + m.colo : '' };
  },
  ipapi(t) {
    const j = JSON.parse(t);
    return { ip: j.ip, geo: joinNz([j.country_name, j.region, j.city], ' · '), isp: joinNz([j.org, j.asn], ' · ') };
  },
  ipify(t) { return { ip: JSON.parse(t).ip }; },
  text(t) { return { ip: findIp(t) }; }
};

function parseEcho(t) {
  try {
    const j = JSON.parse(t);
    const ip = j.ip || j.query || (j.data && j.data.ip) || j.origin;
    if (ip) return String(ip).split(',')[0].trim();
  } catch (e) { /* 不是 JSON */ }
  const m = String(t).match(/^ip=(.+)$/m);
  if (m) return m[1].trim();
  return findIp(t);
}

/* ---------- 配置读写 ---------- */
function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) return normalize(JSON.parse(raw));
  } catch (e) { /* 忽略 */ }
  return clone(DEFAULTS);
}
function normalize(c) {
  const out = Object.assign(clone(DEFAULTS), c || {});
  if (!Array.isArray(out.sites)) out.sites = clone(DEFAULTS.sites);
  if (!Array.isArray(out.ipSources) || !out.ipSources.length) out.ipSources = clone(DEFAULTS.ipSources);
  out.sites = out.sites.filter((s) => s && s.url).map((s) => ({
    id: s.id || uid(), name: s.name || hostOf(s.url), url: s.url, group: s.group || '未分组',
    mode: s.mode === 'cors' ? 'cors' : 'no-cors', echo: s.echo || ''
  }));
  out.ipSources = out.ipSources.filter((s) => s && s.url).map((s, i) => Object.assign({ id: 'src' + i, label: '检测源 ' + (i + 1), parse: 'text' }, s));
  return out;
}
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(cfg)); } catch (e) { toast('无法保存到本地存储'); }
}
function hostOf(u) { try { return new URL(u).host; } catch (e) { return u; } }

  rt: {},        // siteId   -> {status, ms, code, hist[], echoIp, v}

};
const rtOf = (id) => state.rt[id] || (state.rt[id] = { status: 'idle', ms: null, hist: [], v: 0 });

function maskIp(ip) {
  if (!ip || !state.hideIp) return ip || '';
  if (ip.indexOf(':') >= 0) return ip.split(':').slice(0, 2).join(':') + ':****:****';
  const p = ip.split('.');
  return p[0] + '.' + p[1] + '.*.*';
}

    : !cfg.interval ? '自动刷新已关闭'

/* ---------- 渲染：IP 卡片 ---------- */
function baseIp() {
  const b = cfg.ipSources.find((s) => s.base);
  return b && state.ip[b.id] && state.ip[b.id].ip;
}
function ipTag(src, r) {
  if (!r) return ['', '等待中'];
  if (r.error) return ['err', '失败'];
  if (src.family === 'v6') return ['', 'IPv6'];
  if (src.base) return ['same', '基准'];
  const b = baseIp();
  if (!b) return ['', '—'];
  return r.ip === b ? ['same', '与基准一致'] : ['diff', '不同出口'];
}
function renderIpCards() {
  $('ipCards').innerHTML = cfg.ipSources.map((src, i) =>
    `<div class="panel card rise" style="${delay(i)}" data-src="${esc(src.id)}">
      <div class="card-top"><span class="card-label">${esc(src.label)}</span><span class="chip" data-k="tag">等待中</span></div>
      <div class="ip" data-k="ip">—</div>
      <div class="card-meta"><span data-k="geo"></span><span data-k="isp" style="color:var(--ink3)"></span></div>
      <div class="card-foot"><span title="${esc(src.url)}">来源：${esc(hostOf(src.url))}</span><span class="mono" data-k="rtt"></span></div>
    </div>`).join('');
  cfg.ipSources.forEach((s) => updateIpCard(s.id, false));
}
function updateIpCard(id, flash) {
  const card = document.querySelector(`[data-src="${CSS.escape(id)}"]`);
  const src = cfg.ipSources.find((s) => s.id === id);
  if (!card || !src) return;
  const r = state.ip[id];
  const q = (k) => card.querySelector(`[data-k="${k}"]`);
  const [cls, tag] = ipTag(src, r);
  q('tag').className = 'chip' + (cls ? ' ' + cls : '');
  q('tag').textContent = tag;
  const ipEl = q('ip');
  if (r && r.error) {
    ipEl.className = 'ip err';
    ipEl.textContent = r.error;
    q('geo').textContent = '';
    q('isp').textContent = '';
  } else {
    ipEl.className = 'ip';
    ipEl.textContent = r && r.ip ? maskIp(r.ip) : '—';
    q('geo').textContent = (r && r.geo) || '';
    q('isp').textContent = (r && r.isp) || '';
  }
  q('rtt').textContent = r && r.rtt != null ? r.rtt + ' ms' : '';
  if (flash && r && !r.error) replay(ipEl, 'flash');
}
function refreshAllIpTags() { cfg.ipSources.forEach((s) => updateIpCard(s.id, false)); }

async function checkIps() {
  await Promise.allSettled(cfg.ipSources.map(async (src, i) => {
    await sleep(i * cfg.stagger);
    const t0 = performance.now();
    const prev = state.ip[src.id];
    try {
      const res = await fetchT(src.url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const parse = PARSERS[src.parse] || PARSERS.text;
      const info = parse(await res.text());
      if (!info || !info.ip) throw new Error('未返回 IP');
      state.ip[src.id] = Object.assign(info, { rtt: Math.round(performance.now() - t0), v: ((prev && prev.v) || 0) + 1 });
      if (info.geo) state.geo[info.ip] = { geo: info.geo, isp: info.isp };
    } catch (e) {
      const msg = e.name === 'AbortError' ? '超时' : (src.family === 'v6' ? '未检测到 IPv6' : (/^HTTP|未返回/.test(e.message) ? e.message : '请求失败'));
      state.ip[src.id] = { error: msg, v: ((prev && prev.v) || 0) + 1 };
    }
    updateIpCard(src.id, true);
  }));
  refreshAllIpTags();
}

/* ---------- 出口 IP 汇总 ---------- */
function computeExits() {
  const map = new Map();
  const add = (ip, label) => {
    if (!ip) return;
    let e = map.get(ip);
    if (!e) { e = { ip, hits: [] }; map.set(ip, e); }
    if (e.hits.indexOf(label) < 0) e.hits.push(label);
  };
  cfg.ipSources.forEach((s) => { const r = state.ip[s.id]; if (r && r.ip) add(r.ip, s.label); });
  cfg.sites.forEach((s) => { const r = state.rt[s.id]; if (r && r.echoIp) add(r.echoIp, s.name); });
  return Array.from(map.values());
}
async function resolveExitGeo() {
  if (!cfg.geoLookup) return;
  const need = computeExits().filter((e) => !state.geo[e.ip]);
  await Promise.allSettled(need.map(async (e) => {
    const res = await fetchT(cfg.geoLookup.replace('{ip}', encodeURIComponent(e.ip)));
    if (!res.ok) return;
    const info = PARSERS.ipsb(await res.text());
    state.geo[e.ip] = { geo: info.geo, isp: info.isp };
  }));
}
function renderExits(animate) {
  const list = computeExits();
  const b = baseIp();
  if (!list.length) {
    $('exits').innerHTML = `<div class="empty">${state.checking ? '检测中…' : '还没有拿到任何出口 IP。'}</div>`;
    return;
  }
  $('exits').innerHTML = list.map((e, i) => {
    const [bg, fg] = BADGES[i % BADGES.length];
    const g = state.geo[e.ip] || {};
    const route = e.ip.indexOf(':') >= 0 ? 'IPv6' : (b ? (e.ip === b ? '直连' : '分流') : '—');
    return `<div class="exit${animate ? ' rise' : ''}" style="${animate ? delay(i) : ''}">
      <div class="badge" style="background:${bg};color:${fg}">${String.fromCharCode(65 + (i % 26))}</div>
      <div class="exit-main"><div class="exit-ip">${esc(maskIp(e.ip))}</div><div class="muted">${esc(joinNz([g.geo, g.isp], ' · ') || '归属地未知')}</div></div>
      <span class="route">${route}</span>
      <div class="hits">命中：${esc(e.hits.join('、'))}</div>
    </div>`;
  }).join('');
}

/* ---------- 站点表 ---------- */
function groups() {

}

function visibleSites() { return cfg.sites.filter((s) => state.tab === '全部' || s.group === state.tab); }

const ICON_RE = '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>';
const ICON_EDIT = '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
const ICON_DEL = '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg>';

function rowHtml(s, i, animate) {
  return `<div class="grid trow${animate ? ' rise' : ''}" style="${animate ? delay(i) : ''}" data-id="${esc(s.id)}">
    <span class="name" title="${esc(s.name)}">${esc(s.name)}</span>
    <span class="url" title="${esc(s.url)}">${esc(s.url)}${s.mode === 'cors' || s.echo ? `<small>${s.mode === 'cors' ? '读取状态码' : ''}${s.mode === 'cors' && s.echo ? ' · ' : ''}${s.echo ? 'IP 回显' : ''}</small>` : ''}</span>
    <span class="grp" title="${esc(s.group)}">${esc(s.group)}</span>
    <span class="pill" data-k="pill"><i></i><span>未检测</span></span>
    <div class="spark" role="img" aria-label="${esc(s.name)} 近 ${HIST_LEN} 次延迟" data-k="spark">${'<span></span>'.repeat(HIST_LEN)}</div>
    <span class="lat" data-k="lat">—</span>
    <div class="acts">
      <button type="button" class="icon-btn" data-act="recheck" aria-label="重新检测 ${esc(s.name)}">${ICON_RE}</button>
      <button type="button" class="icon-btn" data-act="edit" aria-label="编辑 ${esc(s.name)}">${ICON_EDIT}</button>
      <button type="button" class="icon-btn" data-act="del" aria-label="删除 ${esc(s.name)}">${ICON_DEL}</button>
    </div>
  </div>`;
}
function renderSites(animate, onlyId) {
  const list = visibleSites();
  if (!list.length) {
    $('rows').innerHTML = `<div class="empty">这个分组还没有站点，在下面添加一个吧。</div>`;
  } else {
    $('rows').innerHTML = list.map((s, i) => rowHtml(s, i, animate || s.id === onlyId)).join('');
    list.forEach((s) => updateRow(s.id, false));
  }
  renderCounts();
}
const STATUS_LABEL = { idle: '未检测', ok: '可用', slow: '较慢', down: '不可达', checking: '检测中' };
function updateRow(id, flash) {
  const row = document.querySelector(`#rows [data-id="${CSS.escape(id)}"]`);
  if (!row) return;
  const r = rtOf(id);
  const pill = row.querySelector('[data-k="pill"]');
  pill.className = 'pill ' + r.status;
  pill.querySelector('span').textContent = r.label || STATUS_LABEL[r.status];
  const lat = row.querySelector('[data-k="lat"]');
  lat.classList.toggle('blink', r.status === 'checking');
  lat.textContent = r.status === 'checking' ? '···' : r.status === 'idle' ? '—' : (r.ms == null ? (r.timeout ? '超时' : '—') : r.ms + ' ms');
  if (flash && r.status !== 'checking') replay(lat, 'flash');
  row.querySelector('[data-act="recheck"]').classList.toggle('spin', r.status === 'checking');
  const bars = row.querySelectorAll('[data-k="spark"] span');
  const pad = HIST_LEN - r.hist.length;
  bars.forEach((b, j) => {
    const k = j - pad;
    if (k < 0) { b.style.height = '4px'; b.style.background = 'var(--line)'; return; }
    const v = r.hist[k];
    const last = k === r.hist.length - 1;
    if (v == null) { b.style.height = '4px'; b.style.background = 'var(--down-dot)'; return; }
    b.style.height = Math.max(4, Math.min(26, Math.round(4 + (v / (cfg.slowMs * 1.6)) * 22))) + 'px';
    b.style.background = v > cfg.slowMs ? 'var(--slow-dot)' : (last ? 'var(--accent)' : '#93A3B8');
  });
}
function renderCounts() {
  let ok = 0, slow = 0, down = 0;
  cfg.sites.forEach((s) => { const st = rtOf(s.id).status; if (st === 'ok') ok++; else if (st === 'slow') slow++; else if (st === 'down') down++; });
  $('cOk').textContent = '可用 ' + ok;
  $('cSlow').textContent = '较慢 ' + slow;
  $('cDown').textContent = '不可达 ' + down;
}

async function probe(site) {
  const t0 = performance.now();
  try {
    const res = await fetchT(site.url, { mode: site.mode === 'cors' ? 'cors' : 'no-cors', redirect: 'follow' });
    const ms = Math.round(performance.now() - t0);
    if (site.mode === 'cors' && !res.ok) return { status: 'down', ms, label: 'HTTP ' + res.status };
    return { status: ms > cfg.slowMs ? 'slow' : 'ok', ms, label: '' };
  } catch (e) {
    const timeout = e.name === 'AbortError';
    return { status: 'down', ms: null, timeout, label: timeout ? '超时' : '' };
  }
}
async function checkSite(id) {
  const site = cfg.sites.find((s) => s.id === id);
  if (!site) return;
  const r = rtOf(id);
  r.status = 'checking'; r.label = '';
  updateRow(id, false);
  const [res] = await Promise.all([probe(site), sleep(350)]);
  if (!cfg.sites.find((s) => s.id === id)) return; // 检测途中被删
  Object.assign(r, res);
  r.hist.push(res.ms);
  if (r.hist.length > HIST_LEN) r.hist.shift();
  r.v++;
  if (site.echo) {
    try {
      const er = await fetchT(site.echo);
      r.echoIp = er.ok ? parseEcho(await er.text()) : '';
    } catch (e) { r.echoIp = ''; }
  } else {
    r.echoIp = '';
  }
  updateRow(id, true);
  renderCounts();
}
function checkSites(ids) {
  return Promise.allSettled(ids.map((id, i) => sleep(i * cfg.stagger).then(() => checkSite(id))));
}
async function recheckOne(id) {
  if (rtOf(id).status === 'checking') return;
  await checkSite(id);
  await resolveExitGeo();
  renderExits(false);
}

/* ---------- 一轮完整检测 ---------- */
async function runAll() {
  if (state.checking) return;
  state.checking = true;
  renderLive(); renderCountdown();
  const order = visibleSites().concat(cfg.sites.filter((s) => visibleSites().indexOf(s) < 0)).map((s) => s.id);
  await Promise.allSettled([checkIps(), checkSites(order)]);
  await resolveExitGeo().catch(() => {});
  renderExits(true);
  state.checking = false;
  state.lastChecked = new Date();
  state.remain = cfg.interval;
  renderLive(); renderCountdown();
}

function tick() {
  if (!cfg.interval || state.paused || state.checking) return;
  state.remain -= 1;
  if (state.remain <= 0) { state.remain = cfg.interval; runAll(); }
  renderCountdown();
}

  if (!b || b.dataset.g === state.tab) return;
  state.tab = b.dataset.g;
  renderTabs(); renderSites(true);
});
$('rows').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const id = b.closest('[data-id]').dataset.id;
  if (b.dataset.act === 'recheck') recheckOne(id);
  else if (b.dataset.act === 'edit') startEdit(id);
  else if (b.dataset.act === 'del') {
    const s = cfg.sites.find((x) => x.id === id);
    if (!s || !confirm('删除「' + s.name + '」？')) return;
    cfg.sites = cfg.sites.filter((x) => x.id !== id);
    delete state.rt[id];
    if (state.editing === id) resetForm();
    save(); renderTabs(); renderSites(false); renderExits(false);
  }
});
$('form').addEventListener('submit', (e) => {
  e.preventDefault();
  const url = normUrl($('fUrl').value);
  if (!url) { toast('网址格式不对'); $('fUrl').focus(); return; }
  const echoRaw = $('fEcho').value.trim();
  const echo = echoRaw ? normUrl(echoRaw) : '';
  if (echoRaw && !echo) { toast('IP 回显接口格式不对'); return; }
  const data = {
    name: $('fName').value.trim() || hostOf(url),
    url,
    group: $('fGroup').value.trim() || (state.tab !== '全部' ? state.tab : '内部服务'),
    mode: $('fMode').value === 'cors' ? 'cors' : 'no-cors',
    echo
  };
  let id = state.editing;
  if (id) {
    Object.assign(cfg.sites.find((s) => s.id === id), data);
    const r = rtOf(id); r.hist = []; r.status = 'idle';
  } else {
    id = uid();
    cfg.sites.push(Object.assign({ id }, data));
  }
  if (state.tab !== '全部' && state.tab !== data.group) state.tab = '全部';
  save(); resetForm(); renderTabs(); renderSites(false, id);
  recheckOne(id);
});
$('btnCancel').addEventListener('click', resetForm);

$('btnExport').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(cfg, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'net-probe-config.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
$('btnImport').addEventListener('click', () => $('fileImport').click());
$('fileImport').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!data || !Array.isArray(data.sites)) throw new Error('缺少 sites');
    cfg = normalize(data);
    state.rt = {}; state.ip = {}; state.remain = cfg.interval; state.tab = '全部';
    save(); renderAll(true); toast('已导入 ' + cfg.sites.length + ' 个站点');
    runAll();
  } catch (err) {
    toast('导入失败：' + err.message);
  }
});

$('btnSaveSettings').addEventListener('click', () => {
  let sources;
  try {
    sources = JSON.parse($('sSources').value);
    if (!Array.isArray(sources) || !sources.length) throw new Error('需要一个非空数组');
  } catch (err) { toast('IP 检测源 JSON 有误：' + err.message); return; }
  cfg.slowMs = Math.max(50, Number($('sSlow').value) || DEFAULTS.slowMs);
  cfg.timeoutMs = Math.max(1000, Number($('sTimeout').value) || DEFAULTS.timeoutMs);
  cfg.stagger = Math.min(1000, Math.max(0, Number($('sStagger').value) || 0));
  cfg.motion = $('sMotion').checked;
  const changed = JSON.stringify(sources) !== JSON.stringify(cfg.ipSources);
  cfg = normalize(Object.assign({}, cfg, { ipSources: sources }));
  save(); fillSettings(); toast('设置已保存');
  if (changed) { state.ip = {}; renderIpCards(); checkIps().then(() => renderExits(false)); }
});
$('btnReset').addEventListener('click', () => {
  if (!confirm('恢复默认配置？你添加的站点会被清空（建议先导出）。')) return;
  cfg = clone(DEFAULTS);
  state.rt = {}; state.ip = {}; state.remain = cfg.interval; state.tab = '全部';
  save(); resetForm(); renderAll(true); runAll();
});

/* ---------- 启动 ---------- */
renderAll(true);
runAll();
setInterval(tick, 1000);
</script>
</body>
</html>
